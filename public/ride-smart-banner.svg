<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 380" width="100%" height="100%">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2F5EA" />
      <stop offset="60%" stop-color="#EFFBF5" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Mountain gradients -->
    <linearGradient id="mountBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86B5A1" />
      <stop offset="100%" stop-color="#B2D8C7" />
    </linearGradient>
    <linearGradient id="mountMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E8D70" />
      <stop offset="100%" stop-color="#7BB599" />
    </linearGradient>
    <linearGradient id="mountFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#52B788" />
    </linearGradient>
    <!-- Road gradient -->
    <linearGradient id="roadGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <!-- Overlay Card Gradient -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2FBF6" />
      <stop offset="100%" stop-color="#E1F4EA" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="280" height="380" rx="24" fill="url(#cardBg)" />

  <!-- Sun & Clouds -->
  <circle cx="210" cy="130" r="28" fill="#FEF08A" opacity="0.6" />
  <ellipse cx="60" cy="120" rx="35" ry="12" fill="#FFFFFF" opacity="0.8" />
  <ellipse cx="80" cy="115" rx="25" ry="14" fill="#FFFFFF" opacity="0.8" />

  <!-- Distant Mountains -->
  <path d="M 0 210 L 60 155 L 140 190 L 220 145 L 280 185 L 280 380 L 0 380 Z" fill="url(#mountBack)" />
  <path d="M 0 235 L 75 180 L 165 220 L 255 170 L 280 190 L 280 380 L 0 380 Z" fill="url(#mountMid)" />
  
  <!-- Mid Hills & Forest -->
  <path d="M -10 260 C 50 230 110 240 160 270 C 210 300 250 250 290 260 L 290 380 L -10 380 Z" fill="url(#mountFront)" />

  <!-- Pine trees silhouette -->
  <polygon points="20,240 26,258 14,258" fill="#1B4332" />
  <polygon points="35,232 42,252 28,252" fill="#1B4332" />
  <polygon points="52,242 58,260 46,260" fill="#1B4332" />
  <polygon points="230,245 237,265 223,265" fill="#1B4332" />
  <polygon points="248,238 256,260 240,260" fill="#1B4332" />

  <!-- Winding Asphalt Road -->
  <path d="M 0 380 L 0 300 Q 80 290 120 315 T 280 320 L 280 380 Z" fill="url(#roadGrad)" />
  <!-- Road White Dash Line -->
  <path d="M 0 345 Q 80 305 120 325 T 280 350" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="10 8" />

  <!-- Motorcycle on road -->
  <g transform="translate(60, 260) scale(0.38)">
    <!-- Back wheel -->
    <circle cx="60" cy="140" r="32" fill="#0F172A" stroke="#475569" stroke-width="4" />
    <circle cx="60" cy="140" r="14" fill="#94A3B8" />
    <!-- Front wheel -->
    <circle cx="180" cy="140" r="32" fill="#0F172A" stroke="#475569" stroke-width="4" />
    <circle cx="180" cy="140" r="14" fill="#94A3B8" />
    <!-- Engine & frame -->
    <rect x="90" y="110" width="55" height="40" rx="8" fill="#1E293B" />
    <path d="M 70 135 L 110 110 L 160 90 L 175 140" fill="none" stroke="#0F172A" stroke-width="6" />
    <!-- Green Tank -->
    <path d="M 115 105 C 115 90 125 78 145 78 C 165 78 175 88 175 100 C 160 108 135 110 115 105 Z" fill="#15803D" stroke="#052E16" stroke-width="2" />
    <!-- Seat -->
    <path d="M 75 105 C 90 105 110 102 125 105 L 120 115 L 75 115 Z" fill="#0F172A" />
    <!-- Fork & Handlebars -->
    <line x1="165" y1="80" x2="180" y2="140" stroke="#334155" stroke-width="6" />
    <path d="M 155 72 L 175 75" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" />
    <!-- Headlight -->
    <circle cx="182" cy="85" r="7" fill="#FEF08A" stroke="#334155" stroke-width="2" />
    <!-- Exhaust -->
    <path d="M 110 140 L 65 145" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Typography Card Header -->
  <g transform="translate(24, 38)">
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#0F172A" letter-spacing="-0.5">Ride smart.</text>
    <text x="0" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#0F172A" letter-spacing="-0.5">Log every km.</text>
    <!-- Emerald Accent underline -->
    <rect x="0" y="34" width="36" height="4" rx="2" fill="#10B981" />
  </g>
</svg>
