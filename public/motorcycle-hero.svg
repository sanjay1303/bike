<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532D" />
      <stop offset="40%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#052E16" />
    </linearGradient>
    <linearGradient id="seatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="exhaustGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="60%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="tireGrad" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#1E293B" />
      <stop offset="90%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Ground contact shadow -->
  <ellipse cx="250" cy="285" rx="210" ry="14" fill="#000000" opacity="0.18" />
  <ellipse cx="110" cy="275" rx="55" ry="8" fill="#000000" opacity="0.25" />
  <ellipse cx="390" cy="275" rx="55" ry="8" fill="#000000" opacity="0.25" />

  <g filter="url(#shadow)">
    <!-- REAR WHEEL (Left side in angled view) -->
    <g transform="translate(110, 215)">
      <!-- Outer Tire -->
      <circle cx="0" cy="0" r="62" fill="url(#tireGrad)" stroke="#334155" stroke-width="4" />
      <!-- Tire treads -->
      <circle cx="0" cy="0" r="54" fill="none" stroke="#0F172A" stroke-width="3" stroke-dasharray="6 4" />
      <!-- Rim -->
      <circle cx="0" cy="0" r="44" fill="#0F172A" stroke="url(#metalGrad)" stroke-width="3" />
      <!-- Brake Disc -->
      <circle cx="0" cy="0" r="28" fill="#475569" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 3" />
      <!-- Spokes -->
      <line x1="-42" y1="0" x2="42" y2="0" stroke="#94A3B8" stroke-width="2" />
      <line x1="0" y1="-42" x2="0" y2="42" stroke="#94A3B8" stroke-width="2" />
      <line x1="-30" y1="-30" x2="30" y2="30" stroke="#94A3B8" stroke-width="2" />
      <line x1="-30" y1="30" x2="30" y2="-30" stroke="#94A3B8" stroke-width="2" />
      <!-- Hub -->
      <circle cx="0" cy="0" r="14" fill="#1E293B" stroke="#F1F5F9" stroke-width="1.5" />
      <circle cx="0" cy="0" r="6" fill="#F8FAFC" />
    </g>

    <!-- SWINGARM & REAR SUSPENSION -->
    <path d="M 110 215 L 210 205 L 205 185 L 110 200 Z" fill="#334155" />
    <!-- Rear shock absorber -->
    <rect x="155" y="150" width="12" height="48" rx="6" transform="rotate(25, 161, 174)" fill="#DC2626" />
    <path d="M 152 145 L 168 145 L 175 190 L 160 190 Z" fill="none" stroke="#E2E8F0" stroke-width="2" />

    <!-- ENGINE & GEARBOX CRANKCASE -->
    <!-- Main Engine Block -->
    <rect x="185" y="155" width="85" height="75" rx="14" fill="#1E293B" stroke="#0F172A" stroke-width="2" />
    <!-- Cooling Fins -->
    <line x1="190" y1="168" x2="260" y2="168" stroke="#475569" stroke-width="2.5" />
    <line x1="190" y1="176" x2="262" y2="176" stroke="#475569" stroke-width="2.5" />
    <line x1="188" y1="184" x2="264" y2="184" stroke="#475569" stroke-width="2.5" />
    <line x1="188" y1="192" x2="260" y2="192" stroke="#475569" stroke-width="2.5" />
    <line x1="192" y1="200" x2="255" y2="200" stroke="#475569" stroke-width="2.5" />
    <!-- Crankcase Cover -->
    <circle cx="215" cy="208" r="22" fill="#0F172A" stroke="url(#metalGrad)" stroke-width="2.5" />
    <circle cx="215" cy="208" r="14" fill="#334155" />
    <circle cx="215" cy="208" r="6" fill="#94A3B8" />

    <!-- EXHAUST PIPE -->
    <path d="M 230 170 Q 255 185 260 220 Q 262 235 240 240 L 140 235 L 135 220 L 235 225 Q 248 220 245 195 Z" fill="url(#exhaustGrad)" />
    <!-- Muffler Canister -->
    <rect x="120" y="222" width="95" height="18" rx="6" transform="rotate(-8, 167, 231)" fill="url(#exhaustGrad)" stroke="#1E293B" stroke-width="1.5" />
    <ellipse cx="118" cy="239" rx="4" ry="7" fill="#020617" />

    <!-- CHASSIS FRAME -->
    <!-- Backbone Tube -->
    <path d="M 330 120 L 220 140 L 160 175 L 140 170 L 195 135 L 320 115 Z" fill="#0F172A" />
    <!-- Subframe -->
    <path d="M 215 140 L 120 155 L 105 165 L 175 180 Z" fill="#1E293B" />

    <!-- SEAT (Two-up scrambler style) -->
    <path d="M 125 152 C 145 152 180 150 215 145 C 240 142 245 140 250 145 C 240 156 200 162 135 162 Z" fill="url(#seatGrad)" stroke="#020617" stroke-width="1.5" />
    <!-- Seat stitching lines -->
    <line x1="150" y1="152" x2="148" y2="160" stroke="#64748B" stroke-width="1" />
    <line x1="170" y1="151" x2="168" y2="159" stroke="#64748B" stroke-width="1" />
    <line x1="190" y1="149" x2="188" y2="157" stroke="#64748B" stroke-width="1" />
    <line x1="210" y1="147" x2="208" y2="155" stroke="#64748B" stroke-width="1" />
    <line x1="230" y1="144" x2="228" y2="151" stroke="#64748B" stroke-width="1" />

    <!-- FUEL TANK (Classic British Racing Green / Emerald) -->
    <path d="M 235 142 C 230 125 245 105 280 102 C 315 98 340 110 345 125 C 345 135 320 145 285 146 C 255 146 240 145 235 142 Z" fill="url(#tankGrad)" stroke="#052E16" stroke-width="2" />
    <!-- Tank knee indent shadow -->
    <path d="M 255 128 C 265 118 290 116 310 122 C 300 135 275 138 255 128 Z" fill="#022C22" opacity="0.5" />
    <!-- Chrome tank filler cap -->
    <ellipse cx="300" cy="106" rx="9" ry="4" fill="url(#metalGrad)" stroke="#0F172A" stroke-width="1" />
    <!-- Metallic Tank Stripe Badge -->
    <path d="M 260 122 Q 295 120 330 128" fill="none" stroke="#FEF08A" stroke-width="2.5" />
    <text x="282" y="132" font-family="sans-serif" font-weight="900" font-size="8" fill="#F8FAFC" letter-spacing="1">TRACK</text>

    <!-- FRONT FORK & STEERING -->
    <!-- Triple clamp -->
    <rect x="335" y="105" width="16" height="30" rx="4" transform="rotate(-26, 343, 120)" fill="#1E293B" />
    <!-- Handlebars -->
    <path d="M 320 88 Q 338 94 348 85 L 358 82" fill="none" stroke="#E2E8F0" stroke-width="4.5" stroke-linecap="round" />
    <!-- Handlebar grip -->
    <rect x="312" y="86" width="14" height="6" rx="2" fill="#0F172A" />
    <!-- Rear view round mirror -->
    <circle cx="316" cy="74" r="8" fill="#0F172A" stroke="#E2E8F0" stroke-width="1.5" />
    <line x1="316" y1="82" x2="316" y2="88" stroke="#94A3B8" stroke-width="2" />

    <!-- Headlight (Round vintage/modern LED scrambler style) -->
    <ellipse cx="372" cy="118" rx="14" ry="18" fill="#0F172A" stroke="#334155" stroke-width="2" />
    <ellipse cx="376" cy="118" rx="8" ry="14" fill="#FEF08A" opacity="0.85" />
    <!-- Turn signal indicator -->
    <circle cx="360" cy="138" r="5" fill="#F59E0B" stroke="#0F172A" stroke-width="1" />

    <!-- Front Telescopic Forks -->
    <line x1="344" y1="110" x2="390" y2="215" stroke="#1E293B" stroke-width="9" stroke-linecap="round" />
    <!-- Chrome inner stanchion tube -->
    <line x1="365" y1="160" x2="385" y2="205" stroke="url(#metalGrad)" stroke-width="7" />
    <!-- Lower fork slider -->
    <line x1="380" y1="195" x2="396" y2="230" stroke="#0F172A" stroke-width="10" stroke-linecap="round" />

    <!-- Front Mudguard / Fender -->
    <path d="M 360 178 C 375 168 405 175 422 195" fill="none" stroke="#14532D" stroke-width="6" stroke-linecap="round" />

    <!-- FRONT WHEEL -->
    <g transform="translate(395, 215)">
      <!-- Outer Tire -->
      <circle cx="0" cy="0" r="62" fill="url(#tireGrad)" stroke="#334155" stroke-width="4" />
      <!-- Tire treads -->
      <circle cx="0" cy="0" r="54" fill="none" stroke="#0F172A" stroke-width="3" stroke-dasharray="6 4" />
      <!-- Rim -->
      <circle cx="0" cy="0" r="44" fill="#0F172A" stroke="url(#metalGrad)" stroke-width="3" />
      <!-- Disc Brake Rotor with cooling holes -->
      <circle cx="0" cy="0" r="32" fill="#475569" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 3" />
      <circle cx="0" cy="0" r="22" fill="#334155" />
      <!-- Caliper -->
      <rect x="16" y="-12" width="14" height="24" rx="4" fill="#DC2626" />
      <!-- Spokes -->
      <line x1="-42" y1="0" x2="42" y2="0" stroke="#94A3B8" stroke-width="2" />
      <line x1="0" y1="-42" x2="0" y2="42" stroke="#94A3B8" stroke-width="2" />
      <line x1="-30" y1="-30" x2="30" y2="30" stroke="#94A3B8" stroke-width="2" />
      <line x1="-30" y1="30" x2="30" y2="-30" stroke="#94A3B8" stroke-width="2" />
      <!-- Hub -->
      <circle cx="0" cy="0" r="14" fill="#1E293B" stroke="#F1F5F9" stroke-width="1.5" />
      <circle cx="0" cy="0" r="6" fill="#F8FAFC" />
    </g>
  </g>
</svg>
